name: Automated Folder Extraction Pipeline

on:
  push:
    paths:
      - 'input_pdfs/**'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Underlying Linux Imaging Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Pipeline Python Libraries
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute OCR Data Extraction
      run: |
        python pipeline.py

    - name: Commit Generated Tracking Spreadsheet
      run: |
        git config --global user.name "GitHub Action Automation"
        git config --global user.email "actions@github.com"
        git add Final_Self_Exclusion_Registry.xlsx
        git commit -m "Automated Sync: Compiled registry folder extraction metrics" || echo "No changes detected"
        git push
